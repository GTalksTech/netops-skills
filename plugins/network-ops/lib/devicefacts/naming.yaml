# Interface and zone names that decide two device facts. Shared by every network-ops skill that
# reads device facts (lib/devicefacts). Edit for your naming.

# Names that mark a VLAN, interface or zone as meant to be kept apart from internal networks.
# Matched against VLAN names, SVI and interface descriptions, interface aliases and zone names.
# A name that matches is "segmented"; config checks then look for paths from it into the rest
# of the network.
segmented: '(?:^|[^a-z])(iot|cams?|cameras?|cctv|video|surveillance|guest|visitor|byod|ot|scada|ics|plc|bms|hvac|building|pos|pci)(?:[^a-z]|$)'

# Names that mark an interface or zone as facing the internet, in addition to a public IP
# address or a FortiOS "role wan".
internet_names: '^(untrust|outside|internet|wan\d*|external|isp\d*|inet)$|(?:^|[-_ ])(untrust|outside|internet|wan|isp)(?:[-_ ]|$)'