# How to read device facts for each platform, shared by every network-ops skill that reads
# them (lib/devicefacts). One entry per network-snapshot profile name (the inventory's
# device_type). Adding a platform for version matching is a settings change here, no Python.
#
#   vendor:  the company that makes the platform (shown in reports).
#   kind:    firewall | router_switch. Firewalls default to edge (internet-facing) exposure.
#            An inventory role overrides it (role: firewall on an SRX; ADR 0002, lib/devicetags).
#   version: snapshot file + regex. Group 1 (or the first group that matched) = software
#            version. Optional model regex, read from model_file when it is set.
#            Optional suffix: {regex, format, label}, a part of the release printed on a line of
#            its own, added to the version (ISE's patch: '3.3' + ' Patch 2').
#            Optional os: [{name, regex}] where one profile covers two OSes: the first regex found
#            in the version file names the OS (record field os). IOS XE also prints a 'Cisco IOS
#            Software' line, so IOS XE is tried first.
#   config:  snapshot file holding the running config, and which reader parses it
#            (ios, asa, fortios, panos, junos_set; none = no reader yet: version only).
#   source:  fmc = not read from a snapshot: version and model come from the device records
#            of the Firewall Management Center that manages it (devicefacts/fmc.py, the
#            inventory's fmc: entries). Such an entry has no version or config block.
cisco_ios:
  vendor: Cisco
  kind: router_switch
  version:
    file: show-version.txt
    regex: 'Cisco IOS XE Software, Version\s+(\S+)|Cisco IOS Software.*?Version\s+([^,\s]+)'
    model: '^cisco\s+(\S+)\s+\(.*?\)\s+processor'
    # IOS XE 16/17 print 'Cisco IOS XE Software, Version'; IOS XE 3.x 'IOS-XE Software' on the
    # IOS line; CML's IOL images '[IOSXE]'. Classic IOS never prints IOS XE, IOS-XE or IOSXE.
    os:
      - {name: IOS XE, regex: 'IOS[ -]?XE'}
      - {name: IOS, regex: 'Cisco IOS Software'}
  config: {file: show-running-config-view-full.txt, parser: ios}

cisco_asa:
  vendor: Cisco
  kind: firewall
  version:
    file: show-version.txt
    regex: 'Cisco Adaptive Security Appliance Software Version\s+(\S+)'
    model: '^Hardware:\s+([^,\s]+)'
  config: {file: show-running-config.txt, parser: asa}

fortinet:
  vendor: Fortinet
  kind: firewall
  version:
    file: get-system-status.txt
    regex: '^Version:\s*\S+\s+v(\d+\.\d+\.\d+)'
    model: '^Version:\s*(\S+)\s+v'
  config: {file: show.txt, parser: fortios}

paloalto_panos:
  vendor: Palo Alto Networks
  kind: firewall
  version:
    file: show-system-info.txt
    regex: '^sw-version:\s*(\S+)'
    model: '^model:\s*(\S+)'
  config: {file: show-config-running.txt, parser: panos}

juniper_junos:
  vendor: Juniper
  kind: router_switch          # an SRX is a firewall: set role: firewall on it in the inventory
  version:
    file: show-version.txt
    regex: '^Junos:\s*(\S+)'
    model: '^Model:\s*(\S+)'
  config: {file: show-configuration-display-set.txt, parser: junos_set}

arista_eos:
  vendor: Arista
  kind: router_switch
  version:
    file: show-version.txt
    regex: '^Software image version:\s*(\S+)'
    model: '^Arista\s+(\S+)'
  config: {file: show-running-config.txt, parser: none}

cisco_nxos:
  vendor: Cisco
  kind: router_switch
  version:
    file: show-version.txt
    regex: '(?:NXOS|system):\s+version\s+(\S+)'
    # the chassis line ('cisco Nexus9000 C93180YC-FX Chassis'), not 'Cisco Nexus Operating System'
    model: '^\s*cisco\s+(Nexus\S*\s+\S+)(?:\s+\(.*?\))?\s+Chassis'
  config: {file: show-running-config.txt, parser: none}

aruba_aoscx:
  vendor: HPE Aruba Networking
  kind: router_switch
  version:
    file: show-version.txt
    regex: '^Version\s*:\s*(\S+)'
    model: '^Product Name\s*:\s*(.+)$'
  config: {file: show-running-config.txt, parser: none}

dell_os10:
  vendor: Dell
  kind: router_switch
  version:
    file: show-version.txt
    regex: '^OS Version:\s*(\S+)'
    model: '^System Type:\s*(\S+)'
  config: {file: show-running-configuration.txt, parser: none}

extreme_exos:
  vendor: Extreme Networks
  kind: router_switch
  version:
    file: show-version.txt
    regex: 'ExtremeXOS version (\S+)'
    model_file: show-switch.txt
    model: '^System Type:\s*(\S+)'
  config: {file: show-configuration.txt, parser: none}

hp_procurve:
  vendor: HPE Aruba Networking
  kind: router_switch
  version:
    file: show-version.txt
    regex: '^\s*([A-Z]{1,3}\.\d{2}\.\d{2}\.\d{4})\s*$'
  config: {file: show-running-config.txt, parser: none}

aruba_os:
  # ArubaOS 8 / AOS 10 controllers, gateways and Instant APs. Example line:
  #   ArubaOS (MODEL: 7205), Version 8.10.0.12
  # Written from HPE docs, not yet read from a device.
  vendor: HPE Aruba Networking
  kind: router_switch
  version:
    file: show-version.txt
    regex: 'ArubaOS.*?Version\s+(\d+(?:\.\d+){2,3})'
    model: '\(MODEL:\s*([^)]+)\)'
  config: {file: show-running-config.txt, parser: none}

sonicwall_sonicos:
  # SonicOS 7/8 'show version' (firmware-version "SonicOS 7.0.1-5035"), or SonicOS 6.5, whose
  # firmware line reads "SonicOS Enhanced" then the version, such as version 6.5.4.4-44n.
  # Written from SonicWall docs, not yet read from a device.
  vendor: SonicWall
  kind: firewall
  version:
    file: show-version.txt
    regex: '(?:firmware-version|Firmware Version:?)\s*"?SonicOS\s+(?:Enhanced\s+)?(\d+(?:\.\d+){2,3}-\d+[a-z]?)'
    model: '^\s*(?:model\s+"|Model:\s*)([^"\n]+?)"?\s*$'
  config: {file: show-current-config.txt, parser: none}

huawei_vrp:
  vendor: Huawei
  kind: router_switch
  version:
    file: display-version.txt
    regex: 'VRP \(R\) software, Version \S+ \(\S+ (V\d{3}R\d{3}\S*)\)'
    model: '^HUAWEI\s+(\S+)\s+uptime'
  config: {file: display-current-configuration.txt, parser: none}

nokia_sros:
  vendor: Nokia
  kind: router_switch
  version:
    file: show-system-information.txt
    regex: '^System Version\s*:\s*(\S+)'
    model: '^System Type\s*:\s*(.+?)\s*$'
  config: {file: admin-display-config.txt, parser: none}

cisco_xr:
  # 'Cisco IOS XR Software, Version 7.9.2' (64-bit) or 'Version 6.5.3[Default]' (32-bit). No
  # network-snapshot profile yet: written from Cisco docs, not yet read from a device.
  vendor: Cisco
  kind: router_switch
  version:
    file: show-version.txt
    regex: 'Cisco IOS XR Software, Version\s+(\d+(?:\.\d+)+)'
    model: '^\s*cisco\s+(\S+)\s+(?:Series\s+)?(?:\(.*?\)\s+processor|Chassis)'
  config: {file: show-running-config.txt, parser: none}

cisco_ise:
  # Identity Services Engine 'show version': the release under 'Cisco Identity Services Engine'
  # (3.3.0.430 is release 3.3), the patch under 'Cisco Identity Services Engine Patch'. Cisco
  # names it '3.3 Patch 2'. No network-snapshot profile yet: written from Cisco docs, not yet
  # read from a device.
  vendor: Cisco
  kind: router_switch
  version:
    file: show-version.txt
    regex: '^Cisco Identity Services Engine\s*-+\s*Version\s*:\s*(\d+\.\d+)'
    suffix:
      regex: '^Cisco Identity Services Engine Patch\s*-+\s*Version\s*:\s*(\d+)'
      format: ' Patch {}'
      label: patch
  config: {file: show-running-config.txt, parser: none}

cisco_ftd:
  # Secure Firewall Threat Defense (FTD), managed through FMC: its version ('sw_version') and
  # model come from FMC's device records (REST API, read-only), not from a snapshot. Written
  # from Cisco's published FMC API schema, not yet read from a real FMC.
  vendor: Cisco
  kind: firewall
  source: fmc
