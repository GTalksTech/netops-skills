# ---------- Firewall events ----------
EV-TARGETS-VULNERABLE:
  title: Attacks seen against a CVE that one of your devices is vulnerable to
  why: The IPS saw exploit attempts for a CVE that this check also matched to a device you run.
  fix: Patch the device now and check it for compromise. Confirm the IPS blocks this signature.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-26-04, cisa-kev]
  plane: visibility
  validated: fixture
  controls: [SI-4, SI-2]
  zt_pillar: visibility
EV-NOT-BLOCKED:
  title: Critical or high IPS signature seen and allowed (not blocked)
  why: The IPS saw the attack and let it through, usually because the signature or profile is set to alert only.
  fix: Set the signature action to block or reset, or move the profile to block-on-critical/high.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.7
  sources: [nist-800-94]
  plane: visibility
  validated: fixture
  controls: [SI-4]
  zt_pillar: visibility
EV-SPIKE-SIGNATURE:
  title: Spike in events for one IPS signature
  why: One signature jumped well above its own normal rate (modified z-score over 3.5, NIST/SEMATECH outlier test). That's often a new scan or exploit campaign.
  fix: Look at the sources and targets in the spike window. Confirm the signature blocks, and patch anything it targets.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [nist-sematech-outliers, nist-800-94]
  plane: visibility
  validated: fixture
  controls: [SI-4]
  zt_pillar: visibility
EV-SPIKE-SOURCE:
  title: Spike in events from one source address
  why: One source jumped well above its own normal rate, or tried many different signatures. That's typical of a scanner or an attacker working through exploits.
  fix: Block the source at the edge if it is external. If it is internal, treat the host as possibly compromised.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [nist-sematech-outliers, nist-800-94]
  plane: visibility
  validated: fixture
  controls: [SI-4]
  zt_pillar: visibility

# ---------- device status ----------
FGT-IPS-STALE:
  title: IPS signatures are out of date
  why: The IPS database has not updated in over 30 days, usually because the FortiGuard license expired or the device can't reach FortiGuard. New exploits get through unseen.
  fix: Check the FortiGuard license and "diagnose autoupdate status", then force an update ("execute update-now").
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.6
  sources: [nist-800-94, fortinet-hardening]
  plane: lifecycle
  validated: lab-v2
  controls: [SI-3, SI-4]
  zt_pillar: visibility
