# ---------- Cisco ASA ----------
ASA-ANY-ANY:
  title: Interface ACL permits ip any any
  why: A rule this broad turns the firewall into a router for that path. On the outside interface it opens the whole inside.
  fix: Replace with entries for the real sources, destinations and ports. Check hit counts first.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.8
  sources: [nist-800-41]
  plane: data
  validated: fixture
  controls: [AC-4, SC-7]
  zt_pillar: networks
ASA-MGMT-ON-OUTSIDE:
  title: ASDM (http), SSH or Telnet management allowed on the outside interface
  why: CISA BOD 23-02 tells agencies to take management interfaces off the internet. ASA web-services CVEs are on the KEV list.
  fix: Remove http/ssh/telnet entries for outside interfaces. Manage from inside or over VPN.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-23-02, cisa-kev]
  plane: management
  validated: fixture
  controls: [AC-17, SC-7]
  zt_pillar: devices
ASA-TELNET:
  title: Telnet management is configured
  why: Telnet sends the login in clear text.
  fix: Remove the telnet lines and use SSH.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.5
  sources: [nsa-nisg]
  plane: management
  validated: fixture
  controls: [AC-17, SC-8]
  zt_pillar: devices
ASA-NAT-RISKY:
  title: Static NAT publishes a risky service, or all ports, to the internet
  why: RDP, SMB, Telnet, SSH and database ports facing the internet are a common ransomware entry point.
  fix: Put the service behind VPN. If it must be published, restrict sources in the outside ACL.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisa-stopransomware, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
ASA-SNMP-COMMUNITY:
  title: Default SNMP community (public/private)
  why: A default community lets anyone who reaches UDP 161 read the device.
  fix: Use SNMPv3, or at least a long random community limited to the poller's address.
  known_exploited: true
  automatable: true
  total_control: false
  weight: 0.5
  sources: [cisa-ta18-106a, nsa-nisg]
  plane: management
  validated: fixture
  controls: [IA-5, AC-17]
  zt_pillar: devices
ASA-NO-REMOTE-LOG:
  title: No remote syslog server
  why: Logs kept only on the device are lost on reboot and can be wiped by an attacker.
  fix: logging host <interface> <syslog-server> and logging enable.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [nist-800-92]
  plane: visibility
  validated: fixture
