# Check catalog for network-security-check. Every check names its source (the keys point at
# research/sources.md) and the four BOD 26-04 inputs the score needs. "exposed" is NOT set
# here: the engine works it out per finding from the device config (is the thing reachable
# from a public network?).
#
#   known_exploited: true only when a tier-1 source documents attackers abusing exactly this
#                    weakness on network devices. That source is listed first.
#   automatable / total_control: SSVC meanings (BOD 26-04 points to the CISA/CERT SSVC
#                    definitions). total = the attacker controls the device or what it guards.
#   weight: 0..1, position inside the score band, ordering findings that share a deadline.
#   plane: management | control | data | l2 | visibility | lifecycle. The part of the device
#                    the check looks at, used to group results in the report.
#   validated: lab-v2 = run on the real G Talks Tech lab (round 4 onward) and the result checked by
#                    hand; fixture = tested only on sample configs in tests/fixtures.
#   controls: NIST SP 800-53 Rev 5 control IDs the check gives evidence for (nist-800-53r5).
#                    Kept to the 1-3 closest controls. A mapping, not a compliance claim.
#   zt_pillar: CISA Zero Trust Maturity Model v2 pillar (cisa-ztmm-v2): networks, devices,
#                    identity or visibility (the cross-cutting "visibility and analytics").
#
# Change a value only with a source. Add the source to research/sources.md first.

# ---------- Cisco IOS / IOS-XE ----------
IOS-HTTP-SERVER:
  title: Web UI (ip http server / secure-server) is enabled
  why: The IOS-XE web UI was the entry point for CVE-2023-20198, exploited at scale in 2023. Cisco's own fix guidance is to turn it off where it is not needed.
  fix: "no ip http server / no ip http secure-server, or limit it with ip http access-class to a management subnet."
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.7
  sources: [cisco-sa-iosxe-webui, stig-ios-http, cisa-kev]
  plane: management
  validated: lab-v2
  controls: [CM-7, AC-17]
  zt_pillar: devices
IOS-TELNET:
  title: Telnet allowed on VTY lines
  why: Telnet sends the login and every command in clear text, so anyone on the path can read the password.
  fix: transport input ssh on every line vty.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.6
  sources: [stig-ios-vty-acl, stig-iosxe-ndm-ssh, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-8]
  zt_pillar: devices
IOS-SSH-V1:
  title: SSH version 2 is not enforced
  why: SSHv1 has known protocol weaknesses. Without "ip ssh version 2" the device can accept v1 clients.
  fix: ip ssh version 2.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-iosxe-ndm-ssh, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-8, SC-13]
  zt_pillar: devices
IOS-VTY-ACL:
  title: VTY lines have no access-class
  why: Without an ACL any host that can route to the device can try to log in.
  fix: "access-class <mgmt-acl> in on every line vty, permitting only the management subnet."
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [stig-ios-vty-acl, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-7]
  zt_pillar: networks
IOS-SNMP-COMMUNITY:
  title: Weak SNMP community (default name, read-write, or no ACL)
  why: Default or read-write v1/v2c communities let anyone who can reach UDP 161 read or change config. CISA and NCSC documented state actors using SNMP and Smart Install against Cisco devices (TA18-106A).
  fix: Move to SNMPv3 authPriv. Until then, remove RW communities, use a long random community, and bind it to an ACL.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.6
  sources: [cisa-ta18-106a, stig-ios-snmp, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [IA-5, AC-17, CM-7]
  zt_pillar: devices
IOS-PASSWORD-STORAGE:
  title: Weak password storage (enable password, type 0, type 7 or type 5)
  why: Type 0 is clear text, type 7 is reversible, type 5 is MD5. NSA recommends type 8 or 9.
  fix: Use "enable algorithm-type scrypt secret" and "username X algorithm-type scrypt secret". Then rotate the passwords.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.4
  sources: [nsa-nisg, nsa-cisco-password-types]
  plane: management
  validated: lab-v2
  controls: [IA-5]
  zt_pillar: identity
IOS-SMART-INSTALL:
  title: Smart Install (vstack) is enabled
  why: Smart Install has no authentication. Attackers used it to pull and change configs (Cisco advisory, CISA TA18-106A).
  fix: no vstack.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisco-smart-install, cisa-ta18-106a]
  plane: management
  validated: lab-v2
  controls: [CM-7]
  zt_pillar: devices
IOS-NO-REMOTE-LOG:
  title: No remote syslog server
  why: Logs kept only on the device are lost on reboot and can be wiped by an attacker. You also can't see an attack in progress.
  fix: logging host <syslog-server>.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-ios-logging, nist-800-92]
  plane: visibility
  validated: lab-v2
  controls: [AU-4, AU-9]
  zt_pillar: visibility
IOS-ROUTING-NO-AUTH:
  title: Routing protocol neighbors without authentication
  why: Without neighbor authentication, a device that can reach the routing protocol can form an adjacency and advertise false routes to pull traffic its way. For BGP, that is anyone who can reach TCP 179 on the neighbor address.
  fix: "Authenticate every OSPF, EIGRP and BGP neighbor with a key chain, HMAC-SHA-256 where the release supports it: ip ospf authentication key-chain, authentication mode hmac-sha-256 (EIGRP named mode), and neighbor <ip> ao <key-chain> or neighbor <ip> password for BGP."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.4
  sources: [stig-ios-rtr-auth, cisco-harden-ios]
  plane: control
  validated: lab-v2
  controls: [IA-3, SC-8]
  zt_pillar: networks
IOS-ROUTING-WEAK-AUTH:
  title: Routing protocol authentication uses MD5, or a key chain with no algorithm set
  why: MD5 is not a FIPS 198-1 algorithm. DISA's router STIG asks for HMAC-SHA and records MD5-only authentication as a permanent finding. A key chain with no cryptographic-algorithm line leaves the algorithm to the default for that protocol.
  fix: "Move to a key chain with cryptographic-algorithm hmac-sha-256 (OSPF: ip ospf authentication key-chain; EIGRP named mode: authentication mode hmac-sha-256; BGP: neighbor <ip> ao <tcp key chain> in place of neighbor <ip> password). Keep key lifetimes at 180 days or less."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-ios-rtr-auth]
  plane: control
  validated: fixture
  controls: [IA-3, SC-13]
  zt_pillar: networks
IOS-SEGMENT-ROUTED:
  title: Segmented VLAN routes freely on this switch (no ACL on its SVI)
  why: The VLAN's name says it is meant to be kept apart (IoT, cameras, guest, OT). It has a routed SVI with no inbound ACL, in the same VRF as user or server VLANs, so the switch routes between them and the firewall never sees that traffic.
  fix: Move the gateway for that VLAN to the firewall, put it in its own VRF, or add an inbound ACL that permits only what it needs (DNS, NTP, its controller) and denies the internal ranges.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.7
  sources: [nsa-nisg-segmentation, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, AC-4]
  zt_pillar: networks

IOS-EXEC-TIMEOUT:
  title: Console or vty sessions stay open longer than 5 minutes idle (or never time out)
  why: An idle session left logged in can be used by whoever reaches the terminal or the session next. DISA's STIG ends every management session after 5 minutes idle. A line with no exec-timeout line uses the IOS default of 10 minutes (Cisco Doc 13608), which is over that value; exec-timeout 0 0 never ends the session.
  fix: exec-timeout 5 0 on line con 0 and every line vty.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.15
  sources: [stig-ios-exec-timeout, cisco-harden-ios]
  plane: management
  validated: lab-v2
  controls: [AC-12, SC-10]
  zt_pillar: identity
IOS-LOGIN-BLOCK:
  title: No login lockout (login block-for) for failed logins
  why: Without a limit, password guessing against SSH runs as fast as the attacker likes. DISA's STIG asks for a lockout after three failed attempts. IOS has no lockout unless login block-for is configured.
  fix: login block-for 900 attempts 3 within 120 (and login quiet-mode access-class <mgmt-acl> so the management subnet is not locked out).
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.25
  sources: [stig-ios-login-block]
  plane: management
  validated: lab-v2
  controls: [AC-7]
  zt_pillar: identity
IOS-AAA-CENTRAL:
  title: Remote logins use local accounts only (no TACACS+ or RADIUS), or fewer than two AAA servers
  why: Local accounts live on every device, so they are rarely rotated or removed when someone leaves, and logins are not logged centrally. DISA's STIG asks for at least two authentication servers with the local account as the last resort. IOS has no AAA server by default; with aaa new-model and no default login list, IOS checks local users only.
  fix: "Define two TACACS+ or RADIUS servers in a server group, then aaa authentication login default group <group> local, and keep one local emergency account."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-ios-aaa-servers, cisa-comms-hardening]
  plane: management
  validated: lab-v2
  controls: [IA-2, AC-2]
  zt_pillar: identity
IOS-LOGIN-NONE:
  title: A console or vty line lets users in without authentication
  why: The line's login method list is or ends in "none", or it has "no login". Anyone at the console (or, for a vty, anyone who reaches the device) gets a session without a password, at the line's privilege level. Without aaa new-model, the IOS console default is no login at all. The STIG example applies an authenticating list to line con 0 as well as the vty lines.
  fix: "Apply a login list that authenticates (group <servers> local, or local) to line con 0 and every line vty. Remove 'none' from the method list and 'no login' from the lines."
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.5
  sources: [stig-ios-aaa-servers, cisa-comms-hardening]
  plane: management
  validated: lab-v2
  controls: [IA-2, AC-14]
  zt_pillar: identity
IOS-AAA-ACCOUNTING:
  title: Admin commands are not recorded (no AAA command accounting, no archive log config)
  why: Without a record of who changed what, an unauthorised or mistaken change can't be traced. DISA's STIG checks archive log config with logging enable; Cisco's hardening guide uses AAA command accounting to TACACS+. Neither is on by default.
  fix: "archive / log config / logging enable / notify syslog contenttype plaintext / hidekeys, or aaa accounting commands 15 default start-stop group <tacacs-group> (plus exec accounting)."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-ios-audit-admin, cisco-harden-aaa-acct]
  plane: visibility
  validated: lab-v2
  controls: [AU-2, AU-12]
  zt_pillar: visibility
IOS-BANNER:
  title: No login banner
  why: A banner shown before login states that access is restricted and monitored, which supports legal action against misuse. DISA's STIG and Cisco's hardening guide both ask for one. IOS shows no banner by default.
  fix: "banner login with a short notice (no device name, model or other detail)."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.05
  sources: [stig-ios-banner, cisco-harden-banner]
  plane: management
  validated: lab-v2
  controls: [AC-8]
  zt_pillar: identity
IOS-NTP-AUTH:
  title: NTP is not authenticated
  why: An unauthenticated NTP source can be spoofed to shift the device clock, which breaks log correlation and certificate checks. DISA's STIG asks for ntp authenticate, a trusted key and a key on every server. IOS has no NTP authentication by default.
  fix: "ntp authentication-key 1 hmac-sha2-256 <key> (md5 where the server supports nothing else), ntp authenticate, ntp trusted-key 1, and key 1 on every ntp server line."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-ios-ntp-auth, rfc8633-ntp-bcp]
  plane: management
  validated: lab-v2
  controls: [SC-45, AU-8]
  zt_pillar: devices
IOS-NTP-REDUNDANT:
  title: Fewer than two NTP servers
  why: With one source (or none) the clock drifts or follows a single bad server with nothing to compare against, and log timestamps stop lining up across devices. DISA's STIG asks for two; RFC 8633 recommends four. IOS has no NTP server by default.
  fix: Add a second ntp server (ideally from a different source).
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-ios-ntp-two, rfc8633-ntp-bcp]
  plane: visibility
  validated: lab-v2
  controls: [SC-45(1), AU-8]
  zt_pillar: visibility
IOS-LOG-DEPTH:
  title: Remote syslog has one server only, or the trap level sends almost nothing
  why: One syslog server is a single point of loss for the device's logs. DISA's STIG asks for at least two, and for logging trap at critical or a lower severity (informational, the IOS default when no logging trap line is shown, passes). 'no logging trap' or a trap level of emergencies or alerts sends almost nothing to the servers.
  fix: Add a second logging host and remove any 'logging trap' line set to emergencies or alerts (logging trap informational).
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-ios-logging, stig-ios-logging-level, cisco-harden-logging]
  plane: visibility
  validated: lab-v2
  controls: [AU-9(2), AU-4]
  zt_pillar: visibility
IOS-SNMP-V2C:
  title: SNMP v1/v2c in use (community strings in clear text)
  why: SNMP v1 and v2c send the community string, and every value read, in clear text, so anyone on the path can capture it; an ACL limits who can use the string, not who can read it. DISA's STIG and CISA's communications hardening guidance ask for SNMPv3 with authentication and privacy. IOS has no SNMP by default. Weak or read-write communities are scored separately (IOS-SNMP-COMMUNITY).
  fix: Move pollers and trap hosts to SNMPv3 (snmp-server group <g> v3 priv, users with auth sha and priv aes), then remove the snmp-server community lines.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-ios-snmp, cisa-comms-hardening, cisa-ta18-106a]
  plane: management
  validated: lab-v2
  controls: [SC-8, SC-13]
  zt_pillar: devices
IOS-NO-COPP:
  title: No control plane policing (CoPP)
  why: Without a service-policy under control-plane, every packet sent to the router itself (routing protocols, SSH, SNMP, ICMP, floods) reaches the CPU unfiltered and unlimited, so a flood can take down routing and management. DISA rates it CAT I for routers; RFC 6192 describes the policy. IOS has no CoPP policy by default. Scored as exposed only when the device has an internet-facing interface; on internal routers it is a maintenance item, and on switches with no routing and no internet interface it does not apply.
  fix: "Build class-maps by importance (routing, management, monitoring, default), a policy-map that permits and rate-limits each, then control-plane / service-policy input <policy>. Start with conform/exceed counters, then tighten."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.35
  sources: [stig-ios-copp, rfc6192-control-plane, cisco-harden-ios]
  plane: control
  validated: lab-v2
  controls: [SC-5, SC-7]
  zt_pillar: devices
IOS-EDGE-IP-SERVICES:
  title: Proxy ARP, ICMP redirects or unreachables on, or directed broadcast, on an external interface
  why: IOS XE turns on proxy ARP, ICMP redirects and ICMP unreachables by default, so an external interface without "no ip ..." lines has them. Unreachables help remote mapping and add CPU load; directed broadcast enables smurf amplification. Proxy ARP and redirects only reach the device on the other end of the link. DISA asks for all four to be off on external interfaces. Exposed when unreachables or directed broadcast are on (reachable from beyond the link).
  fix: "On each external interface: no ip proxy-arp, no ip redirects, no ip unreachables, no ip directed-broadcast. (A global ip icmp rate-limit unreachable is accepted instead of no ip unreachables.)"
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.15
  sources: [stig-ios-redirects, stig-ios-unreachables, stig-ios-proxy-arp, stig-ios-directed-bcast, cisco-xe17-ipservices, cisco-harden-ios]
  plane: control
  validated: lab-v2
  controls: [CM-7, SC-7]
  zt_pillar: networks
IOS-EDGE-CDP-LLDP:
  title: CDP or LLDP sent on an external interface
  why: CDP and LLDP advertise the hostname, model, software version and addresses to whatever sits on the other end of the link, the ISP or anyone who taps it. Both are link-local (not routed), so this is never scored as internet-exposed. IOS-XE 17.16 ran CDP with no "cdp run" line in the lab; LLDP is off unless "lldp run". The CDP state is read from the saved show cdp neighbors output when it is there.
  fix: "no cdp enable and no lldp transmit (plus no lldp receive) on each external interface, or no cdp run if CDP is not used anywhere."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-ios-cdp-ext, stig-ios-lldp-ext, cisco-harden-ios]
  plane: control
  validated: lab-v2
  controls: [CM-7, SC-7]
  zt_pillar: networks
IOS-LEGACY-SERVICES:
  title: Legacy services enabled (small servers, finger, BOOTP, PAD, source routing and similar)
  why: DISA lists services that must not be in an IOS XE configuration (TCP/UDP small servers, finger, identd, BOOTP and DNS server, rcmd, PAD, service config, boot network). They are off by default on current IOS, so the check looks for the line. IP source routing is off by default from IOS XE 17.1.1 and on before it, so an older release without "no ip source-route" also fails. Exposed when a listening service is on and an external interface has no inbound ACL (or one that permits ip any any).
  fix: "Remove each line (no service tcp-small-servers, no ip finger, no ip bootp server, no service pad, ...). On releases before IOS XE 17.1.1 add no ip source-route."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.3
  sources: [stig-ios-http, cisco-harden-ios, cisco-xe17-ipservices]
  plane: control
  validated: fixture
  controls: [CM-7]
  zt_pillar: devices
IOS-EDGE-NO-ANTISPOOF:
  title: No anti-spoofing on an external interface (no uRPF, no ACL dropping private sources)
  why: BCP 38/84 ask every edge to drop inbound packets whose source address cannot be legitimate there. Without uRPF or an inbound ACL that denies private (RFC 1918) sources first, spoofed traffic enters the network and the edge can be used in reflection attacks. IOS XE has no uRPF by default. Either control passes; loose uRPF is credited but noted (it drops only sources with no route).
  fix: "ip verify unicast source reachable-via rx on a single-homed external interface (loose 'any' where routing is asymmetric), or an inbound ACL that denies 10/8, 172.16/12, 192.168/16 and your own prefixes as sources before any permit."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.45
  sources: [rfc2827-bcp38, rfc3704-bcp84, rfc8704-bcp84, stig-ios-urpf, stig-ios-bogon-acl]
  plane: data
  validated: lab-v2
  controls: [SC-7, SC-5]
  zt_pillar: networks
IOS-BGP-NO-POLICY:
  title: eBGP neighbor with no inbound or no outbound route filter
  why: RFC 8212 says routes from an eBGP peer must not be used, and none sent, without an explicit policy. With no inbound filter the router accepts whatever the peer sends (route leaks, hijacks); with no outbound filter it can leak every route it knows. Whether IOS XE applies RFC 8212 by default was not verified, so a missing filter is a finding on every release. Peer-groups and peer templates are resolved; iBGP is not graded. Exposed when the neighbor address is public.
  fix: "neighbor <ip> prefix-list <in-list> in and neighbor <ip> prefix-list <out-list> out (or route-maps) on every eBGP neighbor."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.5
  sources: [rfc8212-ebgp-policy, rfc7454-bgp-ops]
  plane: control
  validated: lab-v2
  controls: [SC-7, AC-4]
  zt_pillar: networks
IOS-BGP-MAX-PREFIX:
  title: eBGP neighbor with no maximum-prefix limit
  why: Without a limit a peer that leaks a full table (or a mistake upstream) can fill the routing table and memory. DISA asks for maximum-prefix on each eBGP neighbor; RFC 7454 section 8 recommends it. IOS has no default limit.
  fix: "neighbor <ip> maximum-prefix <n> <warning-%> [restart <min>], sized a little above what the peer normally sends."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.3
  sources: [stig-ios-bgp-maxpfx, rfc7454-bgp-ops]
  plane: control
  validated: lab-v2
  controls: [SC-5, SC-7]
  zt_pillar: networks
IOS-BGP-NO-GTSM:
  title: Directly connected eBGP session without GTSM (ttl-security)
  why: GTSM (RFC 5082) makes the router drop BGP packets that did not come from the next hop (TTL below 255), which stops remote spoofed TCP attacks on the session. RFC 7454 says to use it on directly connected peerings and DISA asks for it on every eBGP peer. Multihop sessions are not graded. IOS has no GTSM by default; both ends must turn it on together.
  fix: "neighbor <ip> ttl-security hops 1 on both routers at the same time (it replaces ebgp-multihop)."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-ios-bgp-gtsm, rfc5082-gtsm, rfc7454-bgp-ops]
  plane: control
  validated: lab-v2
  controls: [SC-5, SC-7]
  zt_pillar: networks
IOS-BGP-INBOUND-PERMISSIVE:
  title: Inbound eBGP prefix-list accepts bogons or prefixes longer than /24
  why: DISA asks the inbound filter from an internet peer to reject bogon space (private, loopback, link-local, CGNAT, multicast, reserved) and IPv4 prefixes longer than /24 (RFC 7454 6.1). The check reads the prefix-list in order and fails only when it can show a route that the list permits. Exact one-prefix entries are not graded for length (a deliberate exception); private-address eBGP neighbors (MPLS VPN and similar) are not graded; route-maps are not read.
  fix: "Add deny entries for the bogon ranges before the permits, and replace 'le 32' ranges with 'le 24' (or list the long prefixes you really need one by one)."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.35
  sources: [stig-ios-bgp-bogons, rfc7454-bgp-ops]
  plane: control
  validated: lab-v2
  controls: [SC-7, AC-4]
  zt_pillar: networks

# ---------- FortiGate (FortiOS) ----------
FGT-ANY-ANY:
  title: Allow policy with any source, any destination and any service
  why: A rule this broad turns the firewall into a router for that path. NIST 800-41 asks for deny by default and rules no wider than the need.
  fix: Replace with rules for the real sources, destinations and services. Check the policy hit counts first to see what it carries.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.8
  sources: [stig-fortigate-fw, nist-800-41]
  plane: data
  validated: lab-v2
  controls: [AC-4, SC-7]
  zt_pillar: networks
FGT-INBOUND-ANY-SERVICE:
  title: Inbound allow from the internet with service ALL
  why: Every port on the destination is reachable from the internet, not just the published service.
  fix: Limit the service to the ports the server publishes.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.7
  sources: [nist-800-41, cisa-stopransomware]
  plane: data
  validated: lab-v2
  controls: [SC-7, CM-7]
  zt_pillar: networks
FGT-MGMT-ON-WAN:
  title: Administrative access (HTTPS/HTTP/SSH/Telnet/SNMP) on an internet-facing interface
  why: CISA BOD 23-02 tells agencies to take network-device management interfaces off the internet. FortiOS admin-interface CVEs are regularly on the KEV list.
  fix: Remove https/http/ssh/telnet/snmp from allowaccess on WAN interfaces. Manage from inside or over VPN. If it must stay, add trusted hosts and a local-in policy.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-23-02, fortinet-hardening, cisa-kev]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-7]
  zt_pillar: devices
FGT-NO-LOG:
  title: Allow policy with traffic logging disabled
  why: If the rule does not log, you can't investigate what went through it.
  fix: set logtraffic all (or utm) on the policy.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [nist-800-41, nist-800-92]
  plane: visibility
  validated: lab-v2
  controls: [AU-2, AU-12]
  zt_pillar: visibility
FGT-INBOUND-NO-IPS:
  title: Inbound allow from the internet without an IPS sensor
  why: Traffic to the published server is not inspected, so exploit attempts against it pass unseen.
  fix: Attach an IPS sensor (and AV for file services) to the policy.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [fortinet-hardening, nist-800-41]
  plane: data
  validated: lab-v2
  controls: [SI-4, SC-7]
  zt_pillar: networks
FGT-VIP-RISKY:
  title: Virtual IP publishes a risky service, or all ports, to the internet
  why: RDP, SMB, Telnet, SSH and database ports facing the internet are a common ransomware entry point (CISA #StopRansomware Guide).
  fix: Put the service behind VPN or ZTNA. If it has to be published, restrict source addresses and publish only the needed port.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisa-stopransomware, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
FGT-ADMIN-NO-TRUSTHOST:
  title: Administrator account with no trusted hosts
  why: Without trusted hosts the account can log in from any address that reaches the admin interface.
  fix: set trusthost1 <mgmt-subnet> on every admin, and add a local-in policy for the admin ports.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.4
  sources: [fortinet-trusthost, fortinet-hardening]
