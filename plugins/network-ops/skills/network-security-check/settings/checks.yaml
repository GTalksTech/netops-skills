# Check catalog for network-security-check. Every check names its source (the keys point at
# research/sources.md) and the four BOD 26-04 inputs the score needs. "exposed" is NOT set
# here: the engine works it out per finding from the device config (is the thing reachable
# from a public network?).
#
#   known_exploited: true only when a tier-1 source documents attackers abusing exactly this
#                    weakness on network devices. That source is listed first.
#   automatable / total_control: SSVC meanings (BOD 26-04 points to the CISA/CERT SSVC
#                    definitions). total = the attacker controls the device or what it guards.
#   weight: 0..1, position inside the score band, ordering findings that share a deadline.
#   plane: management | control | data | l2 | visibility | lifecycle. The part of the device
#                    the check looks at, used to group results in the report.
#   validated: lab-v2 = run on the real G Talks Tech lab (round 4/4b) and the result checked by
#                    hand; fixture = tested only on sample configs in tests/fixtures.
#   controls: NIST SP 800-53 Rev 5 control IDs the check gives evidence for (nist-800-53r5).
#                    Kept to the 1-3 closest controls. A mapping, not a compliance claim.
#   zt_pillar: CISA Zero Trust Maturity Model v2 pillar (cisa-ztmm-v2): networks, devices,
#                    identity or visibility (the cross-cutting "visibility and analytics").
#
# Change a value only with a source. Add the source to research/sources.md first.

# ---------- Cisco IOS / IOS-XE ----------
IOS-HTTP-SERVER:
  title: Web UI (ip http server / secure-server) is enabled
  why: The IOS-XE web UI was the entry point for CVE-2023-20198, exploited at scale in 2023. Cisco's own fix guidance is to turn it off where it is not needed.
  fix: "no ip http server / no ip http secure-server, or limit it with ip http access-class to a management subnet."
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.7
  sources: [cisco-sa-iosxe-webui, stig-ios-http, cisa-kev]
  plane: management
  validated: lab-v2
  controls: [CM-7, AC-17]
  zt_pillar: devices
IOS-TELNET:
  title: Telnet allowed on VTY lines
  why: Telnet sends the login and every command in clear text, so anyone on the path can read the password.
  fix: transport input ssh on every line vty.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.6
  sources: [stig-ios-vty-acl, stig-iosxe-ndm-ssh, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-8]
  zt_pillar: devices
IOS-SSH-V1:
  title: SSH version 2 is not enforced
  why: SSHv1 has known protocol weaknesses. Without "ip ssh version 2" the device can accept v1 clients.
  fix: ip ssh version 2.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-iosxe-ndm-ssh, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-8, SC-13]
  zt_pillar: devices
IOS-VTY-ACL:
  title: VTY lines have no access-class
  why: Without an ACL any host that can route to the device can try to log in.
  fix: "access-class <mgmt-acl> in on every line vty, permitting only the management subnet."
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [stig-ios-vty-acl, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-7]
  zt_pillar: networks
IOS-SNMP-COMMUNITY:
  title: Weak SNMP community (default name, read-write, or no ACL)
  why: Default or read-write v1/v2c communities let anyone who can reach UDP 161 read or change config. CISA and NCSC documented state actors using SNMP and Smart Install against Cisco devices (TA18-106A).
  fix: Move to SNMPv3 authPriv. Until then, remove RW communities, use a long random community, and bind it to an ACL.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.6
  sources: [cisa-ta18-106a, stig-ios-snmp, nsa-nisg]
  plane: management
  validated: lab-v2
  controls: [IA-5, AC-17, CM-7]
  zt_pillar: devices
IOS-PASSWORD-STORAGE:
  title: Weak password storage (enable password, type 0, type 7 or type 5)
  why: Type 0 is clear text, type 7 is reversible, type 5 is MD5. NSA recommends type 8 or 9.
  fix: Use "enable algorithm-type scrypt secret" and "username X algorithm-type scrypt secret". Then rotate the passwords.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.4
  sources: [nsa-nisg, nsa-cisco-password-types]
  plane: management
  validated: lab-v2
  controls: [IA-5]
  zt_pillar: identity
IOS-SMART-INSTALL:
  title: Smart Install (vstack) is enabled
  why: Smart Install has no authentication. Attackers used it to pull and change configs (Cisco advisory, CISA TA18-106A).
  fix: no vstack.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisco-smart-install, cisa-ta18-106a]
  plane: management
  validated: lab-v2
  controls: [CM-7]
  zt_pillar: devices
IOS-NO-REMOTE-LOG:
  title: No remote syslog server
  why: Logs kept only on the device are lost on reboot and can be wiped by an attacker. You also can't see an attack in progress.
  fix: logging host <syslog-server>.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-ios-logging, nist-800-92]
  plane: visibility
  validated: lab-v2
  controls: [AU-4, AU-9]
  zt_pillar: visibility
IOS-ROUTING-NO-AUTH:
  title: Routing protocol neighbors without authentication
  why: Without neighbor authentication, a device that can reach the routing protocol can form an adjacency and advertise false routes to pull traffic its way. For BGP, that is anyone who can reach TCP 179 on the neighbor address.
  fix: "Authenticate every OSPF, EIGRP and BGP neighbor with a key chain, HMAC-SHA-256 where the release supports it: ip ospf authentication key-chain, authentication mode hmac-sha-256 (EIGRP named mode), and neighbor <ip> ao <key-chain> or neighbor <ip> password for BGP."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.4
  sources: [stig-ios-rtr-auth, cisco-harden-ios]
  plane: control
  validated: lab-v2
  controls: [IA-3, SC-8]
  zt_pillar: networks
IOS-ROUTING-WEAK-AUTH:
  title: Routing protocol authentication uses MD5, or a key chain with no algorithm set
  why: MD5 is not a FIPS 198-1 algorithm. DISA's router STIG asks for HMAC-SHA and records MD5-only authentication as a permanent finding. A key chain with no cryptographic-algorithm line leaves the algorithm to the default for that protocol.
  fix: "Move to a key chain with cryptographic-algorithm hmac-sha-256 (OSPF: ip ospf authentication key-chain; EIGRP named mode: authentication mode hmac-sha-256; BGP: neighbor <ip> ao <tcp key chain> in place of neighbor <ip> password). Keep key lifetimes at 180 days or less."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [stig-ios-rtr-auth]
  plane: control
  validated: fixture
  controls: [IA-3, SC-13]
  zt_pillar: networks
IOS-SEGMENT-ROUTED:
  title: Segmented VLAN routes freely on this switch (no ACL on its SVI)
  why: The VLAN's name says it is meant to be kept apart (IoT, cameras, guest, OT). It has a routed SVI with no inbound ACL, in the same VRF as user or server VLANs, so the switch routes between them and the firewall never sees that traffic.
  fix: Move the gateway for that VLAN to the firewall, put it in its own VRF, or add an inbound ACL that permits only what it needs (DNS, NTP, its controller) and denies the internal ranges.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.7
  sources: [nsa-nisg-segmentation, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, AC-4]
  zt_pillar: networks

# ---------- FortiGate (FortiOS) ----------
FGT-ANY-ANY:
  title: Allow policy with any source, any destination and any service
  why: A rule this broad turns the firewall into a router for that path. NIST 800-41 asks for deny by default and rules no wider than the need.
  fix: Replace with rules for the real sources, destinations and services. Check the policy hit counts first to see what it carries.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.8
  sources: [stig-fortigate-fw, nist-800-41]
  plane: data
  validated: lab-v2
  controls: [AC-4, SC-7]
  zt_pillar: networks
FGT-INBOUND-ANY-SERVICE:
  title: Inbound allow from the internet with service ALL
  why: Every port on the destination is reachable from the internet, not just the published service.
  fix: Limit the service to the ports the server publishes.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.7
  sources: [nist-800-41, cisa-stopransomware]
  plane: data
  validated: lab-v2
  controls: [SC-7, CM-7]
  zt_pillar: networks
FGT-MGMT-ON-WAN:
  title: Administrative access (HTTPS/HTTP/SSH/Telnet/SNMP) on an internet-facing interface
  why: CISA BOD 23-02 tells agencies to take network-device management interfaces off the internet. FortiOS admin-interface CVEs are regularly on the KEV list.
  fix: Remove https/http/ssh/telnet/snmp from allowaccess on WAN interfaces. Manage from inside or over VPN. If it must stay, add trusted hosts and a local-in policy.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-23-02, fortinet-hardening, cisa-kev]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-7]
  zt_pillar: devices
FGT-NO-LOG:
  title: Allow policy with traffic logging disabled
  why: If the rule does not log, you can't investigate what went through it.
  fix: set logtraffic all (or utm) on the policy.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [nist-800-41, nist-800-92]
  plane: visibility
  validated: lab-v2
  controls: [AU-2, AU-12]
  zt_pillar: visibility
FGT-INBOUND-NO-IPS:
  title: Inbound allow from the internet without an IPS sensor
  why: Traffic to the published server is not inspected, so exploit attempts against it pass unseen.
  fix: Attach an IPS sensor (and AV for file services) to the policy.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [fortinet-hardening, nist-800-41]
  plane: data
  validated: lab-v2
  controls: [SI-4, SC-7]
  zt_pillar: networks
FGT-VIP-RISKY:
  title: Virtual IP publishes a risky service, or all ports, to the internet
  why: RDP, SMB, Telnet, SSH and database ports facing the internet are a common ransomware entry point (CISA #StopRansomware Guide).
  fix: Put the service behind VPN or ZTNA. If it has to be published, restrict source addresses and publish only the needed port.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisa-stopransomware, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
FGT-ADMIN-NO-TRUSTHOST:
  title: Administrator account with no trusted hosts
  why: Without trusted hosts the account can log in from any address that reaches the admin interface.
  fix: set trusthost1 <mgmt-subnet> on every admin, and add a local-in policy for the admin ports.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.4
  sources: [fortinet-trusthost, fortinet-hardening]
  plane: management
  validated: lab-v2
  controls: [AC-17]
  zt_pillar: identity
FGT-SEGMENT:
  title: Segmented network allowed into internal networks with any service
  why: The interface or zone name says it is meant to be kept apart (IoT, cameras, guest, OT). This policy lets it reach internal networks on every port.
  fix: Allow only what the devices need (their controller, DNS, NTP) and deny the internal ranges.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.7
  sources: [nsa-nisg-segmentation, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, AC-4]
  zt_pillar: networks
# FortiGate hardening (R7, scripts/fgt_hardening.py). FortiOS "show" leaves out lines at their
# default, so an absent line is graded as the default in the FortiOS 7.6.6 / 8.0.0 CLI reference.
FGT-ADMIN-LOCKOUT:
  title: Admin lockout is weaker than the STIG (threshold above 3 or lockout under 900 s)
  why: "The lockout slows password guessing against admin logins. DISA FGFW-ND-000045 asks for lockout after 3 failures for 900 s. FortiOS defaults are threshold 3 (passes) and duration 60 s, so a FortiGate left at defaults fails on duration only: 3 guesses a minute instead of 3 per 15 minutes. Low weight for that reason; exposed only when admin access is on an internet-facing interface."
  fix: "config system global: set admin-lockout-threshold 3, set admin-lockout-duration 900."
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.15
  sources: [stig-fgt-lockout, fortinet-cli-global-80]
  plane: management
  validated: lab-v2
  controls: [AC-7]
  zt_pillar: identity
FGT-ADMIN-TIMEOUT:
  title: Idle admin sessions stay open longer than 10 minutes
  why: "An unattended logged-in session can be used by whoever reaches the workstation. DISA FGFW-ND-000275 sets admintimeout to 10 minutes; Fortinet's best practice is under 10. The FortiOS default is 5 minutes, so only an explicit higher value fails."
  fix: "config system global: set admintimeout 10 (or lower)."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.15
  sources: [stig-fgt-timeout, fortinet-bp-76-admin, fortinet-cli-global-80]
  plane: management
  validated: lab-v2
  controls: [AC-12, SC-10]
  zt_pillar: identity
FGT-WEAK-ADMIN-TLS:
  title: Weak crypto allowed for admin access (strong-crypto off, TLS below 1.2 or SSH v1)
  why: "Old TLS versions and weak ciphers let an attacker on the path downgrade and read the admin session. DISA FGFW-ND-000205 asks for TLS 1.2/1.3 only and SSH v1 off; Fortinet says keep strong-crypto on. FortiOS defaults (strong-crypto enable, admin TLS 1.2 and 1.3, ssl-min-proto-version TLSv1-2, admin-ssh-v1 disable) all pass, so only an explicit weakening fails."
  fix: "config system global: set strong-crypto enable, set admin-https-ssl-versions tlsv1-2 tlsv1-3, set ssl-min-proto-version TLSv1-2, set admin-ssh-v1 disable."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.3
  sources: [stig-fgt-tls, fortinet-bp-76-hardening, fortinet-cli-global-80]
  plane: management
  validated: lab-v2
  controls: [SC-8, SC-13]
  zt_pillar: devices
FGT-ADMIN-CLEARTEXT:
  title: Telnet or HTTP admin access on an internal interface
  why: "Telnet sends the admin password in clear text. HTTP is redirected to HTTPS by default (admin-https-redirect enable), but the listener still answers and a man in the middle can strip the redirect. DISA FGFW-ND-000260/-000265 (CAT I) and Fortinet both say never allow HTTP or Telnet admin access. Internet-facing interfaces are reported by FGT-MGMT-ON-WAN instead, so nothing is counted twice."
  fix: "Remove telnet and http from allowaccess (set allowaccess ping https ssh) on the interface."
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.3
  sources: [stig-fgt-mgmt-proto, fortinet-hardening, fortinet-cli-global-80]
  plane: management
  validated: lab-v2
  controls: [AC-17, SC-8]
  zt_pillar: devices
FGT-ADMIN-NO-2FA:
  title: Local administrator logs in with a password only
  why: "A stolen or guessed password is enough to take over the firewall. Fortinet's best practice is two-factor (FortiToken, email or SMS) for administrator logins. No DISA FortiGate rule covers it. Checked only when the whole admin list is visible: a read-only snapshot account sees only itself, which is reported as not-visible. Remote (RADIUS/LDAP/SAML) admins are skipped: their MFA lives on the server."
  fix: "set two-factor fortitoken (or email/sms) on each local admin, or move admins to remote authentication with MFA and keep one local emergency account."
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.4
  sources: [fortinet-bp-76-admin]
  plane: management
  validated: fixture
  controls: [IA-2(1), IA-2(2)]
  zt_pillar: identity
FGT-PASSWORD-POLICY:
  title: Admin password policy is off or allows passwords shorter than 15 characters
  why: "DISA FGFW-ND-000220 and following ask for an enabled policy with a 15-character minimum. FortiOS defaults depend on the release: up to 7.6.4 the policy is off with an 8-character minimum; from 7.6.5 it is turned on at upgrade with a 12-character minimum. Both fall short of 15, so most FortiGates fail this at a low weight."
  fix: "config system password-policy: set status enable, set apply-to admin-password, set minimum-length 15."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-fgt-password, fortinet-cli-password-policy, fortinet-pwpolicy-765]
  plane: management
  validated: lab-v2
  controls: [IA-5(1)]
  zt_pillar: identity
FGT-NO-REMOTE-LOG:
  title: No remote log target (syslog, FortiAnalyzer or FortiCloud)
  why: "Logs kept only on the firewall can be wiped by an attacker and are lost with the disk. DISA FGFW-ND-000295 (CAT I) asks for a syslog or FortiAnalyzer target with status enable. Every target is off by default (syslogd status default disable)."
  fix: "config log syslogd setting (or log fortianalyzer setting): set status enable, set server <collector>."
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [stig-fgt-remote-log, fortinet-cli-syslogd, nist-800-92]
  plane: visibility
  validated: lab-v2
  controls: [AU-4, AU-9]
  zt_pillar: visibility
FGT-WAN-NO-LOCAL-IN:
  title: Internet-facing interface answers extra services with no local-in policy
  why: "Services such as fabric, fgfm, ftm, speed-test or probe-response on a WAN interface accept connections from any address unless a local-in policy limits them. Fortinet recommends local-in policies to restrict access to the FortiGate itself. Admin protocols on WAN are FGT-MGMT-ON-WAN; this check covers the rest, so nothing is counted twice."
  fix: "Remove the service from allowaccess on the WAN interface, or add a config firewall local-in-policy for that interface that allows only the known peers."
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.2
  sources: [fortinet-bp-76-hardening, fortinet-trusthost]
  plane: management
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
FGT-VIP-UNUSED:
  title: Virtual IP not used by any policy
  why: "A VIP with no policy passes no traffic, so the risk is small. It is left-over config that misleads the next review and can be published by mistake when a policy is added. NIST SP 800-41 asks for regular reviews that remove rules no longer needed. Not graded with central NAT on, where VIPs apply without a policy."
  fix: Delete the VIP if the service is gone, or record why it stays.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.05
  sources: [nist-800-41-review]
  plane: data
  validated: fixture
  controls: [CM-7]
  zt_pillar: networks
FGT-AV-STALE:
  title: Antivirus definitions are out of date while an AV profile is in use
  why: "Virus definitions older than 30 days on the snapshot day mean updates have stopped (license or reachability), so new malware passes the AV profile. Same bar as FGT-IPS-STALE, which covers IPS and application definitions. Not applicable when no policy uses an AV profile."
  fix: Check the FortiGuard AV license and "diagnose autoupdate status", then "execute update-now".
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.4
  sources: [fortinet-hardening, nist-800-94]
  plane: lifecycle
  validated: fixture
  controls: [SI-3]
  zt_pillar: visibility

# ---------- Palo Alto (PAN-OS) ----------
PAN-ANY-ANY:
  title: Allow rule with any source, any destination and any application/service
  why: A rule this broad turns the firewall into a router for that path.
  fix: Replace with rules for the real zones, addresses and App-IDs. Policy Optimizer shows what the rule carries.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.8
  sources: [stig-panw-alg, nist-800-41]
  plane: data
  validated: fixture
  controls: [AC-4, SC-7]
  zt_pillar: networks
PAN-INBOUND-ANY-SERVICE:
  title: Inbound allow from an internet zone with any application and any service
  why: Every port and app on the destination is reachable from the internet.
  fix: Limit the rule to the published App-ID and its default service.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.7
  sources: [stig-panw-alg, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
PAN-MGMT-ON-UNTRUST:
  title: Interface management profile with HTTPS/HTTP/SSH/Telnet/SNMP on an internet-facing interface
  why: CISA BOD 23-02 tells agencies to take management interfaces off the internet. Palo Alto says the same for PAN-OS management access.
  fix: Remove the management profile from internet-facing interfaces (keep ping only if needed). Manage from the dedicated management port or inside.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-23-02, panw-mgmt-access, cisa-kev]
  plane: management
  validated: fixture
  controls: [AC-17, SC-7]
  zt_pillar: devices
PAN-NO-LOG:
  title: Allow rule with log at session end turned off
  why: Without session logs you can't investigate what went through the rule.
  fix: Enable log at session end and log forwarding.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.2
  sources: [nist-800-41, nist-800-92]
  plane: visibility
  validated: fixture
  controls: [AU-2, AU-12]
  zt_pillar: visibility
PAN-INBOUND-NO-PROFILE:
  title: Inbound allow from an internet zone without security profiles
  why: Without a vulnerability protection profile, exploit attempts against the published server pass uninspected.
  fix: Attach a security profile group (vulnerability, antivirus, anti-spyware at least).
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [panw-best-practice, nist-800-41]
  plane: data
  validated: fixture
  controls: [SI-4, SC-7]
  zt_pillar: networks
PAN-NAT-RISKY:
  title: Destination NAT publishes a risky service, or all ports, to the internet
  why: RDP, SMB, Telnet, SSH and database ports facing the internet are a common ransomware entry point.
  fix: Put the service behind VPN. If it must be published, restrict source addresses and the service.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisa-stopransomware, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
PAN-SEGMENT:
  title: Segmented zone allowed into internal zones with any application
  why: The zone name says it is meant to be kept apart (IoT, cameras, guest, OT). This rule lets it reach internal zones with anything.
  fix: Allow only the App-IDs the devices need and deny the rest.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.7
  sources: [nsa-nisg-segmentation, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, AC-4]
  zt_pillar: networks

# ---------- Cisco ASA ----------
ASA-ANY-ANY:
  title: Interface ACL permits ip any any
  why: A rule this broad turns the firewall into a router for that path. On the outside interface it opens the whole inside.
  fix: Replace with entries for the real sources, destinations and ports. Check hit counts first.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.8
  sources: [nist-800-41]
  plane: data
  validated: fixture
  controls: [AC-4, SC-7]
  zt_pillar: networks
ASA-MGMT-ON-OUTSIDE:
  title: ASDM (http), SSH or Telnet management allowed on the outside interface
  why: CISA BOD 23-02 tells agencies to take management interfaces off the internet. ASA web-services CVEs are on the KEV list.
  fix: Remove http/ssh/telnet entries for outside interfaces. Manage from inside or over VPN.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-23-02, cisa-kev]
  plane: management
  validated: fixture
  controls: [AC-17, SC-7]
  zt_pillar: devices
ASA-TELNET:
  title: Telnet management is configured
  why: Telnet sends the login in clear text.
  fix: Remove the telnet lines and use SSH.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.5
  sources: [nsa-nisg]
  plane: management
  validated: fixture
  controls: [AC-17, SC-8]
  zt_pillar: devices
ASA-NAT-RISKY:
  title: Static NAT publishes a risky service, or all ports, to the internet
  why: RDP, SMB, Telnet, SSH and database ports facing the internet are a common ransomware entry point.
  fix: Put the service behind VPN. If it must be published, restrict sources in the outside ACL.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.8
  sources: [cisa-stopransomware, nist-800-41]
  plane: data
  validated: fixture
  controls: [SC-7, CM-7]
  zt_pillar: networks
ASA-SNMP-COMMUNITY:
  title: Default SNMP community (public/private)
  why: A default community lets anyone who reaches UDP 161 read the device.
  fix: Use SNMPv3, or at least a long random community limited to the poller's address.
  known_exploited: true
  automatable: true
  total_control: false
  weight: 0.5
  sources: [cisa-ta18-106a, nsa-nisg]
  plane: management
  validated: fixture
  controls: [IA-5, AC-17]
  zt_pillar: devices
ASA-NO-REMOTE-LOG:
  title: No remote syslog server
  why: Logs kept only on the device are lost on reboot and can be wiped by an attacker.
  fix: logging host <interface> <syslog-server> and logging enable.
  known_exploited: false
  automatable: false
  total_control: false
  weight: 0.1
  sources: [nist-800-92]
  plane: visibility
  validated: fixture
  controls: [AU-4, AU-9]
  zt_pillar: visibility

# ---------- Juniper Junos ----------
JUNOS-TELNET:
  title: Telnet service is enabled
  why: Telnet sends the login in clear text.
  fix: delete system services telnet.
  known_exploited: false
  automatable: false
  total_control: true
  weight: 0.6
  sources: [nsa-nisg]
  plane: management
  validated: fixture
  controls: [AC-17, SC-8]
  zt_pillar: devices
JUNOS-HTTP:
  title: J-Web over plain HTTP is enabled
  why: The admin web UI over HTTP sends the login in clear text. J-Web CVEs have been exploited (KEV).
  fix: delete system services web-management http. Keep https only if needed, bound to a management interface.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.7
  sources: [cisa-kev, nsa-nisg]
  plane: management
  validated: fixture
  controls: [AC-17, SC-8]
  zt_pillar: devices
JUNOS-SNMP-COMMUNITY:
  title: Default or read-write SNMP community
  why: A default or read-write community lets anyone who reaches UDP 161 read or change the device.
  fix: Use SNMPv3. Remove read-write communities and add a client list.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.6
  sources: [cisa-ta18-106a, nsa-nisg]
  plane: management
  validated: fixture
  controls: [IA-5, AC-17]
  zt_pillar: devices

# ---------- Firewall events ----------
EV-TARGETS-VULNERABLE:
  title: Attacks seen against a CVE that one of your devices is vulnerable to
  why: The IPS saw exploit attempts for a CVE that this check also matched to a device you run.
  fix: Patch the device now and check it for compromise. Confirm the IPS blocks this signature.
  known_exploited: true
  automatable: true
  total_control: true
  weight: 0.9
  sources: [cisa-bod-26-04, cisa-kev]
  plane: visibility
  validated: fixture
  controls: [SI-4, SI-2]
  zt_pillar: visibility
EV-NOT-BLOCKED:
  title: Critical or high IPS signature seen and allowed (not blocked)
  why: The IPS saw the attack and let it through, usually because the signature or profile is set to alert only.
  fix: Set the signature action to block or reset, or move the profile to block-on-critical/high.
  known_exploited: false
  automatable: true
  total_control: true
  weight: 0.7
  sources: [nist-800-94]
  plane: visibility
  validated: fixture
  controls: [SI-4]
  zt_pillar: visibility
EV-SPIKE-SIGNATURE:
  title: Spike in events for one IPS signature
  why: One signature jumped well above its own normal rate (modified z-score over 3.5, NIST/SEMATECH outlier test). That's often a new scan or exploit campaign.
  fix: Look at the sources and targets in the spike window. Confirm the signature blocks, and patch anything it targets.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [nist-sematech-outliers, nist-800-94]
  plane: visibility
  validated: fixture
  controls: [SI-4]
  zt_pillar: visibility
EV-SPIKE-SOURCE:
  title: Spike in events from one source address
  why: One source jumped well above its own normal rate, or tried many different signatures. That's typical of a scanner or an attacker working through exploits.
  fix: Block the source at the edge if it is external. If it is internal, treat the host as possibly compromised.
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.5
  sources: [nist-sematech-outliers, nist-800-94]
  plane: visibility
  validated: fixture
  controls: [SI-4]
  zt_pillar: visibility

# ---------- device status ----------
FGT-IPS-STALE:
  title: IPS signatures are out of date
  why: The IPS database has not updated in over 30 days, usually because the FortiGuard license expired or the device can't reach FortiGuard. New exploits get through unseen.
  fix: Check the FortiGuard license and "diagnose autoupdate status", then force an update ("execute update-now").
  known_exploited: false
  automatable: true
  total_control: false
  weight: 0.6
  sources: [nist-800-94, fortinet-hardening]
  plane: lifecycle
  validated: lab-v2
  controls: [SI-3, SI-4]
  zt_pillar: visibility
