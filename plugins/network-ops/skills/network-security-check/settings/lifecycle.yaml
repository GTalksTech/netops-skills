# Software end-of-support dates per platform and release train, for the LIFECYCLE-EOS and
# LIFECYCLE-SOON checks (scripts/lifecycle.py). Basis: CISA BOD 26-02 (end-of-support edge
# devices). Sources are keys in research/sources.md.
#
# Rules for this file:
# - Only dates seen on a vendor page go in. A train with no vendor date is left out, and the
#   check reports n/a for it ("lifecycle unknown for train X, check vendor page").
# - as_of: the day the vendor page was read. A platform table older than 180 days at run time
#   adds a report note asking for a re-read.
# - security_end: the date fields, in order, that mark the last day the train gets security
#   fixes. The first one a train has is used. Fixes ship in maintenance releases, so where a
#   vendor names an "end of engineering" date (no more releases), that is the security end.
# - train: the first two numbers of the running version (17.09.04a -> 17.9, v7.4.2 -> 7.4,
#   10.2.7-h3 -> 10.2, 21.4R3-S5.4 -> 21.4). Special trains (Junos X releases) are not mapped.
# - Hardware end of life is out of scope: it needs per-model tables and is not derivable from
#   the software version.

cisco_ios:
  name: IOS-XE
  vendor_page: https://www.cisco.com/c/en/us/products/collateral/ios-nx-os-software/ios-xe-16/bulletin-c25-741178.html
  as_of: 2026-11-13
  security_end: [end_of_vulnerability_support]
  labels:
    end_of_maintenance: end of SW maintenance releases
    end_of_vulnerability_support: end of vulnerability/security support
    end_of_support: last date of support
