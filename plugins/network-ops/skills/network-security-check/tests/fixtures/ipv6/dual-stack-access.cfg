! Sample dual-stack access switch (IOS XE 17.16 syntax). VLAN 10 (USERS) has an IPv6 SVI here;
! VLAN 20 (VOICE) does not. Gi1/0/1-2 are guarded per port, VLAN 10 also per VLAN; Gi1/0/3 relies on
! the VLAN 10 policy; Gi1/0/4 (VLAN 20) has nothing. Documentation addresses only. Used by
! tests/test_ios_ipv6.py.
version 17.16
service timestamps log datetime msec
hostname ds-acc-01
no ip http server
ip domain name lab.test
vtp mode transparent
ipv6 unicast-routing
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
ip dhcp snooping vlan 10,20
ip dhcp snooping
ip arp inspection vlan 10,20
ipv6 nd raguard policy HOSTS
 device-role host
ipv6 nd raguard policy UPLINK-RTR
 device-role router
ipv6 dhcp guard policy CLIENTS
 device-role client
ipv6 dhcp guard policy UPLINK-SRV
 device-role server
vlan configuration 10
 ipv6 nd raguard attach-policy HOSTS
 ipv6 dhcp guard attach-policy CLIENTS
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name PARKED
interface GigabitEthernet1/0/1
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
 ipv6 nd raguard attach-policy HOSTS
 ipv6 dhcp guard attach-policy CLIENTS
interface GigabitEthernet1/0/2
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
 ipv6 nd raguard
 ipv6 dhcp guard
interface GigabitEthernet1/0/3
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
interface GigabitEthernet1/0/4
 switchport access vlan 20
 switchport mode access
 spanning-tree portfast
 authentication port-control auto
 dot1x pae authenticator
interface GigabitEthernet1/0/24
 description uplink to distribution
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,99
 switchport mode trunk
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 ipv6 nd raguard attach-policy UPLINK-RTR
 ipv6 dhcp guard attach-policy UPLINK-SRV
interface Vlan10
 ip address 10.10.10.2 255.255.255.0
 ipv6 address 2001:DB8:500:10::2/64
interface Vlan20
 ip address 10.10.20.2 255.255.255.0
line vty 0 4
 access-class MGMT-ONLY in
 ipv6 access-class MGMT6-ONLY in
 transport input ssh
ip access-list standard MGMT-ONLY
 permit 192.168.1.0 0.0.0.255
ipv6 access-list MGMT6-ONLY
 permit ipv6 2001:DB8:500:99::/64 any
end
