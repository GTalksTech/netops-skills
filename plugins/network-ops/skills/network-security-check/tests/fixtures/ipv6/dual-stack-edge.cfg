! Sample dual-stack internet edge router (IOS XE 17.16 syntax), hardened for IPv4 and IPv6.
! Documentation addresses only (RFC 5737, RFC 3849). Used by tests/test_ios_ipv6.py.
version 17.16
service timestamps log datetime msec
hostname ds-edge-01
no ip http server
no ip http secure-server
ip domain name lab.test
no cdp run
ipv6 unicast-routing
class-map match-any CM-ROUTING
 match access-group name CPP-BGP
policy-map CPP
 class CM-ROUTING
  police 64000 conform-action transmit exceed-action drop
control-plane
 service-policy input CPP
interface Loopback0
 ip address 203.0.113.250 255.255.255.255
 ipv6 address 2001:DB8:500::1/128
interface GigabitEthernet0/0
 description ISP
 ip address 198.51.100.2 255.255.255.252
 ip access-group EDGE-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ipv6 address 2001:DB8:FFFF::2/126
 ipv6 address FE80::2 link-local
 ipv6 traffic-filter EDGE6-IN in
 no ipv6 redirects
 no ipv6 unreachables
 ipv6 nd ra suppress all
interface GigabitEthernet0/1
 description LAN
 ip address 10.0.0.1 255.255.255.0
 ipv6 address 2001:DB8:500:1::1/64
 ipv6 address FD00:10::1/64
router bgp 65010
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 198.51.100.1 remote-as 64500
 neighbor 198.51.100.1 ttl-security hops 1
 neighbor 2001:DB8:FFFF::1 remote-as 64500
 neighbor 2001:DB8:FFFF::1 ttl-security hops 1
 address-family ipv4
  neighbor 198.51.100.1 activate
  neighbor 198.51.100.1 prefix-list ISP-IN in
  neighbor 198.51.100.1 prefix-list OUR-NETS out
  neighbor 198.51.100.1 maximum-prefix 1000 80
 exit-address-family
 address-family ipv6
  network 2001:DB8:500::/48
  neighbor 2001:DB8:FFFF::1 activate
  neighbor 2001:DB8:FFFF::1 prefix-list ISP6-IN in
  neighbor 2001:DB8:FFFF::1 prefix-list OUR6-NETS out
  neighbor 2001:DB8:FFFF::1 maximum-prefix 1000 80
 exit-address-family
ip access-list extended EDGE-IN
 10 deny ip 10.0.0.0 0.255.255.255 any
 20 deny ip 172.16.0.0 0.15.255.255 any
 30 deny ip 192.168.0.0 0.0.255.255 any
 40 permit tcp host 198.51.100.1 host 198.51.100.2 eq bgp
 50 permit ip any any
ipv6 access-list EDGE6-IN
 permit icmp any any nd-na
 permit icmp any any nd-ns
 sequence 30 deny ipv6 FC00::/7 any
 sequence 40 deny ipv6 2001:DB8:500::/48 any
 sequence 50 deny ipv6 any any routing
 sequence 60 permit tcp host 2001:DB8:FFFF::1 host 2001:DB8:FFFF::2 eq bgp
 sequence 70 permit ipv6 any any
ip prefix-list ISP-IN seq 5 deny 10.0.0.0/8 le 32
ip prefix-list ISP-IN seq 10 deny 172.16.0.0/12 le 32
ip prefix-list ISP-IN seq 15 deny 192.168.0.0/16 le 32
ip prefix-list ISP-IN seq 20 permit 0.0.0.0/0
ip prefix-list OUR-NETS seq 5 permit 203.0.113.0/24
ipv6 prefix-list ISP6-IN seq 5 deny ::/8 le 128
ipv6 prefix-list ISP6-IN seq 10 deny 100::/64 le 128
ipv6 prefix-list ISP6-IN seq 15 deny 2001::/32 le 128
ipv6 prefix-list ISP6-IN seq 20 deny 2001:2::/48 le 128
ipv6 prefix-list ISP6-IN seq 25 deny 2001:10::/28 le 128
ipv6 prefix-list ISP6-IN seq 30 deny FC00::/7 le 128
ipv6 prefix-list ISP6-IN seq 35 deny FE80::/10 le 128
ipv6 prefix-list ISP6-IN seq 40 deny FF00::/8 le 128
ipv6 prefix-list ISP6-IN seq 45 permit ::/0
ipv6 prefix-list ISP6-IN seq 50 permit 2000::/3 le 48
ipv6 prefix-list OUR6-NETS seq 5 permit 2001:DB8:500::/48
line con 0
 exec-timeout 5 0
line vty 0 4
 access-class MGMT-ONLY in
 ipv6 access-class MGMT6-ONLY in
 transport input ssh
ip access-list standard MGMT-ONLY
 permit 192.168.1.0 0.0.0.255
ipv6 access-list MGMT6-ONLY
 permit ipv6 2001:DB8:500:99::/64 any
end
