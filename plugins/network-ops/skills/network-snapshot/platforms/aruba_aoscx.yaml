# HPE Aruba AOS-CX
status: untested          # written from HPE Aruba docs; not yet run on a device. Fixes welcome.
netmiko_device_type: aruba_aoscx
invalid_markers: ["Invalid input", "% Command incomplete", "Permission denied", "% Unknown command", "% Ambiguous command"]
uptime:
  cmd: show system
  regex: 'Up Time\s*:\s*(.+)'
commands:
  - cmd: show running-config
  - cmd: show version
  - cmd: show system
  - cmd: show interface brief
  - cmd: show vlan
  - cmd: show lacp aggregates
  - cmd: show vsx brief
  - cmd: show spanning-tree summary
  - cmd: show lldp neighbor-info detail
  - cmd: show ip route all-vrfs
  - cmd: show ip ospf neighbors all-vrfs
  - cmd: show bgp all summary
health_commands:                       # run only with --health; never committed or diffed
  - cmd: show environment fan
  - cmd: show environment power-supply
  - cmd: show environment temperature
  - cmd: show system resource-utilization
  - cmd: show boot-history
  - cmd: show interface transceiver detail
  - cmd: show interface
  - cmd: show interface error-statistics
  - cmd: show spanning-tree detail
  - cmd: show vsx status
  - cmd: show vrrp brief
  - cmd: show ntp status
  - cmd: show ntp associations
  - cmd: show events -r -c 200
  - cmd: show clock
strip:
  - '^Current configuration:'
  - 'Up Time'
  - 'CPU Util'
  - 'Memory Usage'
  - '^\s*Neighbor Chassis-ID TTL'
  - 'TTL\s*:'
mask:
  - pattern: '\b\d{1,2}:\d{2}:\d{2}\b'
    replace: '--:--:--'
