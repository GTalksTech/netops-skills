# Cisco ASA
status: untested          # written from Cisco docs; not yet run on a device. Fixes welcome.
netmiko_device_type: cisco_asa
invalid_markers: ["ERROR: % Invalid input", "% Invalid input", "ERROR: Command authorization failed"]
uptime:
  cmd: show version
  regex: ' up (.+)'
commands:
  - cmd: show running-config
  - cmd: show version
  - cmd: show inventory
  - cmd: show interface ip brief
  - cmd: show nameif
  - cmd: show route
  - cmd: show failover state
  - cmd: show ospf neighbor
  - cmd: show bgp summary
health_commands:                       # run only with --health; never committed or diffed
  - cmd: show environment
  - cmd: show failover
  - cmd: show failover history
  - cmd: show cpu usage
  - cmd: show memory
  - cmd: show blocks
  - cmd: show resource usage
  - cmd: show conn count
  - cmd: show interface
  - cmd: show crashinfo
  - cmd: show ntp status
  - cmd: show ntp associations
  - cmd: show logging
  - cmd: show clock
strip:
  - '^: Written by'
  - '^: Saved'
  - '^Cryptochecksum:'
  - ' up \d+'
  - '^Configuration last modified by'
  - '^Failover cluster up '
mask:
  - pattern: '\b\d{1,2}:\d{2}:\d{2}\b'
    replace: '--:--:--'
