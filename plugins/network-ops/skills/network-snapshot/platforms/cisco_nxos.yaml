# Cisco NX-OS (Nexus)
status: untested          # written from Cisco docs; not yet run on a device. Fixes welcome.
netmiko_device_type: cisco_nxos
invalid_markers: ["% Invalid command", "% Incomplete command", "% Permission denied", "% Invalid parameter"]
uptime:
  cmd: show system uptime
  regex: 'System uptime:\s*(.+)'
commands:
  - cmd: show running-config
  - cmd: show version
  - cmd: show inventory
  - cmd: show interface brief
  - cmd: show vlan brief
  - cmd: show port-channel summary
  - cmd: show vpc brief
  - cmd: show spanning-tree summary
  - cmd: show cdp neighbors detail
  - cmd: show ip route vrf all
  - cmd: show ip ospf neighbors vrf all
  - cmd: show bgp all summary
health_commands:                       # run only with --health; never committed or diffed
  - cmd: show system resources
  - cmd: show system reset-reason
  - cmd: show cores
  - cmd: show environment
  - cmd: show module
  - cmd: show interface transceiver details
  - cmd: show interface
  - cmd: show interface counters errors
  - cmd: show interface status err-disabled
  - cmd: show spanning-tree detail
  - cmd: show spanning-tree inconsistentports
  - cmd: show vpc
  - cmd: show hsrp brief
  - cmd: show vrrp
  - cmd: show ip ospf neighbors detail vrf all
  - cmd: show bgp sessions vrf all
  - cmd: show ntp peer-status
  - cmd: show ntp status
  - cmd: show logging logfile last-index 500
  - cmd: show clock
strip:
  - '^!Time:'
  - '^!Running configuration last done at'
  - 'uptime is'
  - '^\s*Holdtime\s*:'
  - '^Kernel uptime is'
  - '^Last reset'
mask:
  - pattern: '\b\d{1,2}:\d{2}:\d{2}\b'
    replace: '--:--:--'
  - pattern: '\b\d+[ywd]\d+[dhw]\b'
    replace: '--'
sort_blocks:
  show cdp neighbors detail: '^Device ID:'
