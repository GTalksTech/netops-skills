# Palo Alto Networks PAN-OS (firewall CLI)
status: untested          # written from Palo Alto docs; not yet run on a device. Fixes welcome.
netmiko_device_type: paloalto_panos
invalid_markers: ["Invalid syntax", "Unknown command", "Server error"]
uptime:
  cmd: show system info
  regex: 'uptime:\s*(.+)'
commands:
  - cmd: show config running
  - cmd: show system info
  - cmd: show interface all
  - cmd: show routing route
  - cmd: show routing protocol ospf neighbor
  - cmd: show routing protocol bgp summary
  - cmd: show high-availability state
health_commands:                       # run only with --health; never committed or diffed
  - cmd: show system resources
  - cmd: show system environmentals
  - cmd: show system disk-space
  - cmd: show high-availability all
  - cmd: show session info
  - cmd: show counter global filter severity drop
  - cmd: show interface all
  - cmd: show ntp
  - cmd: show system state filter cfg.platform.*
  - cmd: show log system direction equal backward
  - cmd: show clock
strip:
  - '^uptime:'
  - '^time:'
  - 'app-release-date:'
  - 'threat-release-date:'
  - 'wildfire-release-date:'
  - 'av-release-date:'
mask:
  - pattern: '\b\d{1,2}:\d{2}:\d{2}\b'
    replace: '--:--:--'
